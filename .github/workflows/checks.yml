name: Check app and Docker image
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node --test tests/test_csv_*.js
      - run: docker build -t spearmint:test .
      - name: Check container startup and data volume
        run: |
          docker run -d --name spearmint-check -p 127.0.0.1:8085:8080 -e APP_PASSWORD=ci-only-password-not-for-real-use -v spearmint-test:/data spearmint:test
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8085/health; then exit 0; fi
            sleep 1
          done
          docker logs spearmint-check
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f spearmint-check || true
